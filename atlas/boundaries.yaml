summary: ""
boundaries:
  - name: .github
    globs:
      - .github/**
    role: config
  - name: docs
    globs:
      - docs/**
    role: code
  - name: root
    globs:
      - "*"
    role: config
  - name: site
    globs:
      - site/**
    role: site
  - name: src
    globs:
      - src/**
    role: code
  - name: tests
    globs:
      - tests/**
    role: test
