name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
      - 'atlas/**'
      - 'codecov.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    # id-token: write lets the Codecov steps sign in with a short-lived OIDC
    # token; without it Codecov refuses the upload ("Token required because
    # branch is protected"). Naming any permission sets the rest to none, so
    # contents: read is stated for the checkout.
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      # Atlas requires Node 22 or later, so the check runs on the 22 cell only.
      - name: Atlas check
        if: matrix.node == 22
        run: npx --yes @dogfood-lab/atlas@1.20.0 check

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        id: tests
        run: npm run test:run -- --reporter=default --reporter=junit --outputFile.junit=junit.xml

      - name: Check for placeholder tests
        run: |
          if grep -rn "expect(true)\.toBe(true)\|expect(1 + 1)\.toBe(2)\|it('placeholder'" tests/ src/__tests__/ 2>/dev/null; then
            echo "::error::Placeholder tests detected. Replace with real assertions or use it.skip() with a tracking issue."
            exit 1
          fi

      # Coverage and test results go to Codecov from one leg, the lowest
      # supported Node.
      - name: Test coverage
        if: matrix.node == 20
        run: npm run coverage -- --coverage.reporter=text --coverage.reporter=lcov

      # Both uploads sign in with OIDC and fail the job when Codecov refuses
      # the report. The upload this replaces was refused on every run, and
      # continue-on-error hid it. Test results go up whenever the tests ran,
      # failures included, because a failing test is what that report
      # exists to show.
      - name: Upload coverage to Codecov
        if: matrix.node == 20
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: ./coverage/lcov.info

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.node == 20 && steps.tests.outcome != 'skipped' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: true
          report_type: test_results
          disable_search: true
          files: ./junit.xml

  build-check:
    name: Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clean build
        run: npm run clean

      - name: Build
        run: npm run build

      - name: Check dist output
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not created"
            exit 1
          fi
          if [ ! -f "dist/index.js" ]; then
            echo "Error: dist/index.js not found"
            exit 1
          fi
          echo "Build artifacts present"

      - name: Verify exports
        run: node -e "import('./dist/index.js').then(() => console.log('Package exports valid'))"

  audit:
    name: npm audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run npm audit
        run: npm audit --audit-level=moderate

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@586f66d7886cd0b037c7c245d4a6e34ef357ab10 # v3.94.1
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
